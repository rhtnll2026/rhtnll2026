<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }} · Built with <a href="https://jekyllrb.com">Jekyll</a>, hosted free on <a href="https://pages.github.com">GitHub Pages</a>.</p>
    <p class="footer-links">
      {% if site.author.github %}<a href="https://github.com/{{ site.author.github }}">GitHub</a>{% endif %}
      {% if site.author.email %}<a href="mailto:{{ site.author.email }}">Email</a>{% endif %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
  </div>
</footer>

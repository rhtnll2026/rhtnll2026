<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{% seo %}
{% feed_meta %}
{%- if page.lang and page.ref -%}
{% include translation.html %}
{%- if translation %}
<link rel="alternate" hreflang="{% if page.lang == 'zh' %}zh-CN{% else %}en{% endif %}" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="{% if translation.lang == 'zh' %}zh-CN{% else %}en{% endif %}" href="{{ translation.url | absolute_url }}">
{%- endif -%}
{%- endif %}
<script>
  (function () {
    var root = document.documentElement, theme, lang;
    try {
      theme = localStorage.getItem("theme");
      lang = localStorage.getItem("lang");
    } catch (e) {}
    if (theme === "light" || theme === "dark") root.dataset.theme = theme;
    if (lang !== "en" && lang !== "zh") {
      var langs = navigator.languages || [navigator.language || ""];
      lang = /^zh/i.test(langs[0] || "") ? "zh" : "en";
    }
    root.dataset.uiLang = lang;
    root.lang = lang === "zh" ? "zh-CN" : "en";
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@600;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">

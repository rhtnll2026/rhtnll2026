# ─── Site settings ────────────────────────────────────────────────
# Edit these to make the blog your own.
title: rhtnll2026
tagline: Notes, ideas & things I'm learning
description: >-
  A personal blog — writing about code, tools, and whatever I'm
  curious about this week.
lang: en

author:
  name: rhtnll2026
  bio: Developer, learner, occasional writer.
  github: rhtnll2026
  # email: you@example.com    # uncomment to show a mail link

# Where the site lives. Served from the rhtnll2026.github.io repository, so no baseurl.
# (The deploy workflow passes the right baseurl from GitHub Pages, so a project-site
# address like https://<user>.github.io/<repo>/ keeps working too.)
url: "https://rhtnll2026.github.io"
baseurl: ""

# ─── Build settings ───────────────────────────────────────────────
permalink: /:year/:month/:day/:title/
timezone: UTC
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

# Posts are English by default. Chinese posts go in _posts/zh/ and are served under /zh/.
# To link a post with its translation, give both the same `ref:`.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: en
  - scope:
      path: "_posts/zh"
      type: posts
    values:
      lang: zh
      locale: zh_CN
      permalink: /zh/:year/:month/:day/:title/
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - README.md
  - BLOG_GUIDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
